<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaHR ERP • Incidents</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="incidents">
  <header class="page-top glass">
    <div class="page-user">
      <img id="sessionAvatar" class="profile-avatar" src="" alt="User avatar" />
      <div>
        <h2 id="sessionUserName" class="top-name"></h2>
        <p id="sessionUserRole" class="top-role"></p>
      </div>
    </div>
    <div class="page-actions">
      <a class="btn secondary" href="modules.html">Go to Modules</a>
      <button id="logoutBtn" class="btn-link" type="button">Logout</button>
    </div>
  </header>
  <main><section class="card glass fade-in"><div class="section-head"><h2>Incidents & Disciplinary Cases</h2><button class="secondary-btn" data-load="incidents" type="button">Load Data</button></div><form id="incidentForm" class="form-grid"><input name="employee" placeholder="Employee" required /><input name="date" type="date" required /><input name="incident" placeholder="Incident" required /><select name="resolution" required><option>Open</option><option>Under Review</option><option>Warning Issued</option><option>Resolved</option></select><button type="submit">Log Incident</button></form><table><thead><tr><th>Employee</th><th>Date</th><th>Incident</th><th>Resolution</th><th>Delete</th></tr></thead><tbody id="incidentTable"></tbody></table></section></main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
