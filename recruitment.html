      </div>

  <main><section class="card glass fade-in"><div class="section-head"><h2>Recruitment Pipeline</h2><button class="secondary-btn" data-load="recruitment" type="button">Load Data</button></div>
  <form id="recruitForm" class="form-grid"><input name="candidate" placeholder="Candidate Name" required /><input name="position" placeholder="Position" required /><select name="stage" required><option>Applied</option><option>Screening</option><option>Interview</option><option>Offer</option><option>Hired</option><option>Rejected</option></select><button type="submit">Add Candidate</button></form>
  <table><thead><tr><th>Candidate</th><th>Position</th><th>Stage</th><th>Delete</th></tr></thead><tbody id="recruitTable"></tbody></table></section></main>
  <footer><p>PharmaHR ERP Prototype • Local role-based prototype</p></footer>
  <script src="auth.js"></script>
  <script src="app.js"></script>
