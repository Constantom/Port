<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaHR ERP • Recruitment</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="recruitment">
  <header class="page-top glass">
    <div class="page-user">
      <img id="sessionAvatar" class="profile-avatar" src="" alt="User avatar" />
      <div>
        <h2 id="sessionUserName" class="top-name"></h2>
        <p id="sessionUserRole" class="top-role"></p>
      </div>
    </div>
    <div class="page-actions">
      <a class="btn secondary" href="modules.html">Go to Modules</a>
      <button id="logoutBtn" class="btn-link" type="button">Logout</button>
    </div>
  </header>
  <main><section class="card glass fade-in"><div class="section-head"><h2>Recruitment Pipeline</h2><button class="secondary-btn" data-load="recruitment" type="button">Load Data</button></div><form id="recruitForm" class="form-grid"><input name="candidate" placeholder="Candidate Name" required /><input name="position" placeholder="Position" required /><select name="stage" required><option>Applied</option><option>Screening</option><option>Interview</option><option>Offer</option><option>Hired</option><option>Rejected</option></select><button type="submit">Add Candidate</button></form><table><thead><tr><th>Candidate</th><th>Position</th><th>Stage</th><th>Delete</th></tr></thead><tbody id="recruitTable"></tbody></table></section></main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
