<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaHR ERP • Attendance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="attendance">
  <header class="page-top glass">
    <div class="page-user">
      <img id="sessionAvatar" class="profile-avatar" src="" alt="User avatar" />
      <div>
        <h2 id="sessionUserName" class="top-name"></h2>
        <p id="sessionUserRole" class="top-role"></p>
      </div>
    </div>
    <div class="page-actions">
      <a class="btn secondary" href="modules.html">Go to Modules</a>
      <button id="logoutBtn" class="btn-link" type="button">Logout</button>
    </div>
  </header>
  <main><section class="card glass fade-in"><div class="section-head"><h2>Attendance & Overtime</h2><button class="secondary-btn" data-load="attendance" type="button">Load Data</button></div><form id="attendanceForm" class="form-grid"><input name="employee" placeholder="Employee" required /><input name="date" type="date" required /><input name="hoursWorked" type="number" min="0" step="0.5" placeholder="Hours" required /><input name="overtime" type="number" min="0" step="0.5" placeholder="Overtime" required /><button type="submit">Log Attendance</button></form><table><thead><tr><th>Employee</th><th>Date</th><th>Hours</th><th>Overtime</th><th>Delete</th></tr></thead><tbody id="attendanceTable"></tbody></table></section></main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
