<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaHR ERP • Approvals</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="approvals">
  <header class="page-top glass">
    <div class="page-user">
      <img id="sessionAvatar" class="profile-avatar" src="" alt="User avatar" />
      <div>
        <h2 id="sessionUserName" class="top-name"></h2>
        <p id="sessionUserRole" class="top-role"></p>
      </div>
    </div>
    <div class="page-actions">
      <a class="btn secondary" href="modules.html">Go to Modules</a>
      <button id="logoutBtn" class="btn-link" type="button">Logout</button>
    </div>
  </header>
  <main><section class="card glass fade-in"><div class="section-head"><h2>Approval Center (Admin Only)</h2><button class="secondary-btn" data-load="approvals" type="button">Load Data</button></div><h3>Pending Leave Approvals</h3><table><thead><tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Status</th><th>Actions</th></tr></thead><tbody id="approvalsLeaveTable"></tbody></table><h3>Open Incident Cases</h3><table><thead><tr><th>Employee</th><th>Date</th><th>Incident</th><th>Resolution</th><th>Actions</th></tr></thead><tbody id="approvalsIncidentTable"></tbody></table></section></main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
