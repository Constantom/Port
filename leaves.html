<main><section class="card glass fade-in"><div class="section-head"><h2>Leave Management</h2><button class="secondary-btn" data-load="leaves" type="button">Load Data</button></div><form id="leaveForm" class="form-grid"><input name="employee" placeholder="Employee" required /><select name="type" required><option>Annual</option><option>Sick</option><option>Maternity/Paternity</option><option>Emergency</option><option>Unpaid</option></select><input name="start" type="date" required /><input name="end" type="date" required /><select name="status" required><option>Pending</option><option>Approved</option><option>Rejected</option></select><button type="submit">Submit Leave</button></form><table><thead><tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Status</th><th>Delete</th></tr></thead><tbody id="leaveTable"></tbody></table></section></main>
