<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaHR ERP • Compliance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="compliance">
  <header class="page-top glass">
    <div class="page-user">
      <img id="sessionAvatar" class="profile-avatar" src="" alt="User avatar" />
      <div>
        <h2 id="sessionUserName" class="top-name"></h2>
        <p id="sessionUserRole" class="top-role"></p>
      </div>
    </div>
    <div class="page-actions">
      <a class="btn secondary" href="modules.html">Go to Modules</a>
      <button id="logoutBtn" class="btn-link" type="button">Logout</button>
    </div>
  </header>
  <main><section class="card glass fade-in"><div class="section-head"><h2>Compliance, Training & Certification</h2><button class="secondary-btn" data-load="compliance" type="button">Load Data</button></div><form id="complianceForm" class="form-grid"><input name="employee" placeholder="Employee" required /><input name="module" placeholder="Module" required /><input name="expiry" type="date" required /><select name="status" required><option>Valid</option><option>Expiring Soon</option><option>Expired</option></select><button type="submit">Add Compliance Record</button></form><table><thead><tr><th>Employee</th><th>Module</th><th>Expiry</th><th>Status</th><th>Delete</th></tr></thead><tbody id="complianceTable"></tbody></table></section></main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
