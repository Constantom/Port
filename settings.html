<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaHR ERP • Settings</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="settings">
  <header class="page-top glass">
    <div class="page-user">
      <img id="sessionAvatar" class="profile-avatar" src="" alt="User avatar" />
      <div>
        <h2 id="sessionUserName" class="top-name"></h2>
        <p id="sessionUserRole" class="top-role"></p>
      </div>
    </div>
    <div class="page-actions">
      <a class="btn secondary" href="modules.html">Go to Modules</a>
      <button id="logoutBtn" class="btn-link" type="button">Logout</button>
    </div>
  </header>
  <main><section class="card glass fade-in"><div class="section-head"><h2>My Settings</h2><button class="secondary-btn" data-load="settings" type="button">Load Data</button></div><form id="settingsForm" class="form-grid"><label class="toggle-label">Dark Mode <input type="checkbox" id="themeToggle" /></label><button type="submit">Save Preferences</button></form><p class="note">Profile picture is managed from Modules page profile section.</p><p id="settingsMessage" class="message"></p></section></main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
