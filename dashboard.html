<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaHR ERP • Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="dashboard">
  <header class="page-top glass">
    <div class="page-user">
      <img id="sessionAvatar" class="profile-avatar" src="" alt="User avatar" />
      <div>
        <h2 id="sessionUserName" class="top-name"></h2>
        <p id="sessionUserRole" class="top-role"></p>
      </div>
    </div>
    <div class="page-actions">
      <a class="btn secondary" href="modules.html">Go to Modules</a>
      <button id="logoutBtn" class="btn-link" type="button">Logout</button>
    </div>
  </header>
  <main><section class="card glass fade-in"><div class="section-head"><h2>Executive Dashboard (Admin Only)</h2><button class="secondary-btn" data-load="dashboard" type="button">Load Data</button></div><div id="metrics" class="grid"></div><div class="chart-grid"><article class="chart-card glass"><h3>Recruitment Pipeline by Stage</h3><canvas id="pipelineChart" width="520" height="260"></canvas></article><article class="chart-card glass"><h3>Monthly Payroll Trend</h3><canvas id="payrollTrendChart" width="520" height="260"></canvas></article><article class="chart-card glass"><h3>Leave Status Overview</h3><canvas id="leaveDonutChart" width="520" height="260"></canvas></article></div></section></main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
