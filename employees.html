<main><section class="card glass fade-in"><div class="section-head"><h2>Employees</h2><button class="secondary-btn" data-load="employees" type="button">Load Data</button></div><form id="employeeForm" class="form-grid"><input name="name" placeholder="Full Name" required /><input name="role" placeholder="Role" required /><input name="license" placeholder="License" /><input name="department" value="Pharmacy" required /><input name="hireDate" type="date" required /><select name="status" required><option>Active</option><option>Probation</option><option>On Leave</option><option>Suspended</option></select><button type="submit">Add Employee</button></form><table><thead><tr><th>Name</th><th>Role</th><th>License</th><th>Hire Date</th><th>Status</th><th>Delete</th></tr></thead><tbody id="employeesTable"></tbody></table></section></main>
