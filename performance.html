<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaHR ERP • Performance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="performance">
  <header class="page-top glass">
    <div class="page-user">
      <img id="sessionAvatar" class="profile-avatar" src="" alt="User avatar" />
      <div>
        <h2 id="sessionUserName" class="top-name"></h2>
        <p id="sessionUserRole" class="top-role"></p>
      </div>
    </div>
    <div class="page-actions">
      <a class="btn secondary" href="modules.html">Go to Modules</a>
      <button id="logoutBtn" class="btn-link" type="button">Logout</button>
    </div>
  </header>
  <main><section class="card glass fade-in"><div class="section-head"><h2>Performance Reviews</h2><button class="secondary-btn" data-load="performance" type="button">Load Data</button></div><form id="performanceForm" class="form-grid"><input name="employee" placeholder="Employee" required /><input name="reviewDate" type="date" required /><input name="score" type="number" min="1" max="5" placeholder="Score" required /><input name="notes" placeholder="Notes" required /><button type="submit">Record Review</button></form><table><thead><tr><th>Employee</th><th>Review Date</th><th>Score</th><th>Notes</th><th>Delete</th></tr></thead><tbody id="performanceTable"></tbody></table></section></main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
