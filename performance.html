  <nav class="navbar glass">

    <div class="nav-links nav-scroll">
        <a href="dashboard.html" data-module-link="dashboard" class="">Dashboard</a>

        <a href="employees.html" data-module-link="employees" class="">Employees</a>

        <a href="attendance.html" data-module-link="attendance" class="">Attendance</a>

        <a href="payroll.html" data-module-link="payroll" class="">Payroll</a>
        <a href="compliance.html" data-module-link="compliance" class="">Compliance</a>

      <div class="profile-pill">
        <img id="sessionAvatar" class="profile-avatar" src="" alt="User avatar" />

      </div>
      <button id="logoutBtn" class="btn-link" type="button">Logout</button>

  <main><section class="card glass fade-in"><div class="section-head"><h2>Performance Reviews</h2><button class="secondary-btn" data-load="performance" type="button">Load Data</button></div>
  <form id="performanceForm" class="form-grid"><input name="employee" placeholder="Employee" required /><input name="reviewDate" type="date" required /><input name="score" type="number" min="1" max="5" placeholder="Score" required /><input name="notes" placeholder="Notes" required /><button type="submit">Record Review</button></form>
  <table><thead><tr><th>Employee</th><th>Review Date</th><th>Score</th><th>Notes</th><th>Delete</th></tr></thead><tbody id="performanceTable"></tbody></table></section></main>
  <footer><p>PharmaHR ERP Prototype • Local role-based prototype</p></footer>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
