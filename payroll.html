<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaHR ERP • Payroll</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="payroll">
  <header class="page-top glass">
    <div class="page-user">
      <img id="sessionAvatar" class="profile-avatar" src="" alt="User avatar" />
      <div>
        <h2 id="sessionUserName" class="top-name"></h2>
        <p id="sessionUserRole" class="top-role"></p>
      </div>
    </div>
    <div class="page-actions">
      <a class="btn secondary" href="modules.html">Go to Modules</a>
      <button id="logoutBtn" class="btn-link" type="button">Logout</button>
    </div>
  </header>
  <main><section class="card glass fade-in"><div class="section-head"><h2>Payroll</h2><button class="secondary-btn" data-load="payroll" type="button">Load Data</button></div><form id="payrollForm" class="form-grid"><input name="employee" placeholder="Employee" required /><input name="month" type="month" required /><input name="basic" type="number" min="0" placeholder="Basic" required /><input name="allowance" type="number" min="0" placeholder="Allowances" required /><input name="deductions" type="number" min="0" placeholder="Deductions" required /><button type="submit">Run Payroll</button></form><table><thead><tr><th>Employee</th><th>Month</th><th>Gross</th><th>Deductions</th><th>Net</th><th>Delete</th></tr></thead><tbody id="payrollTable"></tbody></table></section></main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
