<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaHR ERP • Shifts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="shifts">
  <header class="page-top glass">
    <div class="page-user">
      <img id="sessionAvatar" class="profile-avatar" src="" alt="User avatar" />
      <div>
        <h2 id="sessionUserName" class="top-name"></h2>
        <p id="sessionUserRole" class="top-role"></p>
      </div>
    </div>
    <div class="page-actions">
      <a class="btn secondary" href="modules.html">Go to Modules</a>
      <button id="logoutBtn" class="btn-link" type="button">Logout</button>
    </div>
  </header>
  <main><section class="card glass fade-in"><div class="section-head"><h2>Shift Scheduling</h2><button class="secondary-btn" data-load="shifts" type="button">Load Data</button></div><form id="shiftForm" class="form-grid"><input name="employee" placeholder="Employee" required /><input name="date" type="date" required /><select name="shift" required><option>Morning</option><option>Evening</option><option>Night</option><option>On-Call</option></select><input name="location" placeholder="Location" required /><button type="submit">Assign Shift</button></form><table><thead><tr><th>Employee</th><th>Date</th><th>Shift</th><th>Location</th><th>Delete</th></tr></thead><tbody id="shiftTable"></tbody></table></section></main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
