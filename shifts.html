<body data-page="shifts">
  <nav class="navbar glass">
    <a class="brand" href="dashboard.html">PharmaHR ERP</a>
    <div class="nav-links nav-scroll">
        <a href="dashboard.html" data-module-link="dashboard" class="">Dashboard</a>
        <a href="approvals.html" data-module-link="approvals" class="">Approvals</a>
        <a href="employees.html" data-module-link="employees" class="">Employees</a>
        <a href="recruitment.html" data-module-link="recruitment" class="">Recruitment</a>
        <a href="shifts.html" data-module-link="shifts" class="active">Shifts</a>
        <a href="attendance.html" data-module-link="attendance" class="">Attendance</a>
        <a href="leaves.html" data-module-link="leaves" class="">Leaves</a>
        <a href="payroll.html" data-module-link="payroll" class="">Payroll</a>
        <a href="compliance.html" data-module-link="compliance" class="">Compliance</a>
        <a href="incidents.html" data-module-link="incidents" class="">Incidents</a>
        <a href="performance.html" data-module-link="performance" class="">Performance</a>
        <a href="settings.html" data-module-link="settings" class="">Settings</a>
    </div>
    <div class="nav-links">
      <div class="profile-pill">
        <img id="sessionAvatar" class="profile-avatar" src="" alt="User avatar" />
        <span id="sessionUser" class="session-user"></span>
      </div>
      <button id="logoutBtn" class="btn-link" type="button">Logout</button>
    </div>

  <main><section class="card glass fade-in"><div class="section-head"><h2>Shift Scheduling</h2><button class="secondary-btn" data-load="shifts" type="button">Load Data</button></div>
  <form id="shiftForm" class="form-grid"><input name="employee" placeholder="Employee" required /><input name="date" type="date" required /><select name="shift" required><option>Morning</option><option>Evening</option><option>Night</option><option>On-Call</option></select><input name="location" placeholder="Location" required /><button type="submit">Assign Shift</button></form>
  <table><thead><tr><th>Employee</th><th>Date</th><th>Shift</th><th>Location</th><th>Delete</th></tr></thead><tbody id="shiftTable"></tbody></table></section></main>
  <footer><p>PharmaHR ERP Prototype • Local role-based prototype</p></footer>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
